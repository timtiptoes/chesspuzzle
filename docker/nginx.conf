server {
    listen 80;

    root /usr/share/nginx/html;
    index chesspuzzleui.html;

    location / {
        try_files $uri $uri/ /chesspuzzleui.html;
    }

    location = /board_key.png {
        proxy_pass http://localhost:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/(make|hello|listcategories|key|lastmove|drawit)/ {
        proxy_pass http://localhost:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
